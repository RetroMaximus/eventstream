[project]
name = "eventstream"
version = "0.0.1"
description = "Event & tournament streaming control plane for Raspberry Pi"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    "python-dotenv>=1.0",
    "aiohttp>=3.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { include = ["*"] } }

