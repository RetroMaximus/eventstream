<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <meta name="csrf-token" content="{{ csrf_token }}">
  <link rel="stylesheet" href="/static/css/app.css">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">{{ app_name }}</a>
    <nav class="site-nav">
      {% if is_authenticated %}
        <a href="/dashboard">Dashboard</a>
        <form method="post" action="/logout" class="inline-form">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button type="submit" class="btn-link">Log out</button>
        </form>
      {% else %}
        <a href="/login">Log in</a>
        <a href="/register">Register</a>
      {% endif %}
      <button type="button" class="theme-toggle" aria-label="Toggle theme"
              onclick="(function(){var h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';})()">
        Theme
      </button>
    </nav>
  </header>

  <main class="site-main">
    {% if flash %}
      <div class="flash flash-{{ flash.kind|default('info') }}">{{ flash.message }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <small>{{ app_name }} &middot; request {{ request_id }}</small>
  </footer>

  <script src="/static/js/csrf.js" defer></script>
  {% block body_extra %}{% endblock %}
</body>
</html>
